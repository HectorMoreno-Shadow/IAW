# Batería UD5 · Bloque 1 · El sitio del polideportivo: Nginx sirve los estáticos y le pasa el resto a Python (Gunicorn).
# Después de cambiar algo: ./bateria.sh recargar (o ./bateria.sh comprobar 1, que ya lo hace).

# 👀 1.1 Ejemplo: todo lo que llega por HTTP se manda a HTTPS (301).
server {
    listen 80 default_server;
    server_name polideportivo.iaw.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name polideportivo.iaw.local;

    ssl_certificate     /etc/ssl/lab/lab.crt;
    ssl_certificate_key /etc/ssl/lab/lab.key;

    root /var/www/polideportivo/static;       # 👀 1.2 los estáticos (estilo.css, hola.txt) los sirve Nginx

    access_log /var/log/nginx/polideportivo_access.log;
    error_log  /var/log/nginx/polideportivo_error.log;

    location / {
    try_files $uri @app;
    }

    location @app {
    proxy_pass http://app:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

}
